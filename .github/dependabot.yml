version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # yt-dlp's pinned companions move together; check them against `pip show yt-dlp` before merging.
      yt-dlp:
        patterns: [yt-dlp, certifi, requests, urllib3]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      # The page's build tools move together (vite, the svelte plugin, vitest...).
      frontend:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    groups:
      # Tauri's crates and plugins are released as a set.
      tauri:
        patterns: [tauri, tauri-*]
