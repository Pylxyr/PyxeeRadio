name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build, as in package.json (e.g. 1.1.0 or 1.1.0-rc1). Builds and uploads artifacts; publishes nothing."
        required: true
  # Called by cut-release.yml (the one-click release). A tag pushed with the default
  # GITHUB_TOKEN does not start workflows, so that workflow calls this one directly.
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # Empty (the triggering ref) for a tag push or a dry run; the new tag when called.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          CALLED_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$CALLED_TAG" ]; then TAG="$CALLED_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ]; then TAG="v${INPUT_VERSION#v}"
          else TAG="$REF_NAME"; fi
          python3 scripts/bump-version.py --check "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # The trimmed ffmpeg for both platforms, built from pinned source (see ffmpeg.yml).
  ffmpeg:
    needs: version-guard
    uses: ./.github/workflows/ffmpeg.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: [version-guard, ffmpeg]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: pip install --require-hashes -r requirements-build.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows-x64
          path: packaging/bin
      # Same check as the Linux build gets in ffmpeg.yml, here on real Windows: Schannel, the Windows
      # certificate store, and the app's own command lines against every container YouTube serves.
      - name: Check the trimmed ffmpeg
        run: |
          pip install trustme==1.2.1
          python scripts/check_ffmpeg.py packaging/bin/ffmpeg.exe --require-tls --https-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/fixtures/audio/tone.webm"
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      # yt-dlp's JavaScript runtime in the installed app: QuickJS, a pinned and checksum-verified download.
      - name: QuickJS (the JavaScript runtime that ships with the app)
        run: python scripts/fetch_qjs.py windows
      - name: Smoke test the frozen core
        run: python scripts/smoke_core.py --exe dist/core/PyxeeRadioCore/PyxeeRadioCore.exe --bin packaging/bin
      # Best effort. YouTube routinely answers GitHub-hosted runners with "Sign in to confirm you're not a
      # bot", which says nothing about the build, so a failure here is a warning and does not stop the
      # release. The frozen-core checks above stay required. After a release, play one link from the
      # installed app to confirm YouTube works end to end.
      - name: Real YouTube resolve + JS solver download (best effort)
        id: live-resolve
        continue-on-error: true
        run: python scripts/smoke_core.py --exe dist/core/PyxeeRadioCore/PyxeeRadioCore.exe --bin packaging/bin --resolve-only
      - name: Flag a failed live YouTube check
        if: steps.live-resolve.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Live YouTube check failed::YouTube refused the CI runner or the JS solver could not be downloaded. The release was not blocked. Try one link in the installed app."
          {
            echo "### Live YouTube check failed (release not blocked)"
            echo "YouTube often blocks GitHub-hosted runners. Install the build and play one link to confirm."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Desktop app - install, check and test the page
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Detect code-signing secrets
        id: sign
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD not set: building an unsigned installer."
          fi
      # The certificate goes into the user's store; Tauri's bundler then signs the app and the installer by thumbprint.
      - name: Import the code-signing certificate
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if ($env:WIN_CSC_LINK -match '^https://') { Invoke-WebRequest -Uri $env:WIN_CSC_LINK -OutFile $pfx }
          else { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK)) }
          $password = ConvertTo-SecureString -String $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          python scripts/tauri_signing_config.py $cert.Thumbprint app/src-tauri/tauri.signing.conf.json
      - name: Build the installer
        working-directory: app
        shell: pwsh
        run: |
          $configs = @("src-tauri/tauri.release.conf.json")
          if (Test-Path src-tauri/tauri.signing.conf.json) { $configs += "src-tauri/tauri.signing.conf.json" }
          $args = @("tauri", "build", "--bundles", "nsis")
          foreach ($c in $configs) { $args += @("--config", $c) }
          npx @args
      # Install the built installer for real, silently, and run the frozen core from where it landed:
      # this is what proves the installed layout (core\, bin\ with ffmpeg and QuickJS) is what the app expects.
      - name: Installed layout works
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $dir = Join-Path $env:RUNNER_TEMP "pyxeeradio-installed"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dir" -Wait
          foreach ($f in "PyxeeRadio.exe", "core\PyxeeRadioCore.exe", "bin\ffmpeg.exe", "bin\qjs.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing from the installed app: $f" }
          }
          python scripts/smoke_core.py --exe "$dir\core\PyxeeRadioCore.exe" --bin "$dir\bin"
          Get-Item "$dir\PyxeeRadio.exe", $installer.FullName | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - name: Collect release files
        shell: pwsh
        run: |
          $built = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $built) { throw "Installer not found" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # GitHub turns spaces in asset names into dots; name the file as users will receive it.
          Copy-Item $built.FullName "release/PyxeeRadio.Setup.$env:VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux:
    needs: [version-guard, ffmpeg]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: pip install --require-hashes -r requirements-build.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-linux-x64
          path: packaging/bin
      - run: chmod +x packaging/bin/ffmpeg
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      # yt-dlp's JavaScript runtime in the installed app: QuickJS, a pinned and checksum-verified download.
      - name: QuickJS (the JavaScript runtime that ships with the app)
        run: python scripts/fetch_qjs.py linux
      - name: Smoke test the frozen core
        run: python scripts/smoke_core.py --exe dist/core/PyxeeRadioCore/PyxeeRadioCore --bin packaging/bin
      # Best effort, like the Windows job: YouTube often refuses GitHub-hosted runners.
      - name: Real YouTube resolve + JS solver download (best effort)
        id: live-resolve
        continue-on-error: true
        run: python scripts/smoke_core.py --exe dist/core/PyxeeRadioCore/PyxeeRadioCore --bin packaging/bin --resolve-only
      - name: Flag a failed live YouTube check
        if: steps.live-resolve.outcome == 'failure'
        run: |
          echo "::warning title=Live YouTube check failed (Linux)::YouTube refused the CI runner or the JS solver could not be downloaded. The release was not blocked."
      - name: Desktop app - install, check and test the page
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
      - name: System libraries the shell links against (WebKitGTK, the tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config xdg-utils
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the desktop app
        working-directory: app
        run: npx tauri build --no-bundle
      - name: Package the tarball
        run: scripts/package-linux.sh "$VERSION"
      # Unpack the tarball the way a user would and run the frozen core from where it landed: this proves
      # the layout (core/, bin/ with ffmpeg and QuickJS) is what the app expects.
      - name: Unpacked tarball works
        run: |
          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "dist/app/PyxeeRadio-${VERSION}-linux-x64.tar.gz"
          root="$dir/PyxeeRadio-${VERSION}-linux-x64"
          for f in PyxeeRadio core/PyxeeRadioCore bin/ffmpeg bin/qjs; do test -x "$root/$f" || { echo "Missing or not executable: $f"; exit 1; }; done
          python scripts/smoke_core.py --exe "$root/core/PyxeeRadioCore" --bin "$root/bin"
          ldd "$root/PyxeeRadio" | grep -i "not found" && { echo "The app links against a library that is missing"; exit 1; } || true
          ls -la dist/app "$root/PyxeeRadio"
      - name: Collect release files
        run: |
          mkdir -p release
          f="dist/app/PyxeeRadio-${VERSION}-linux-x64.tar.gz"
          test -f "$f" || { echo "Not found: $f"; exit 1; }
          cp "$f" release/
          ls -la release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version-guard, build, build-linux]
    # A tag push, or a call from cut-release.yml. A manual dry run has neither.
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      models: read # lets the release-notes step use GitHub Models (free) with the built-in token
    env:
      TAG: ${{ needs.version-guard.outputs.tag }}
      VERSION: ${{ needs.version-guard.outputs.version }}
      SIGNED: ${{ needs.build.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums and notices
        run: |
          cp THIRD_PARTY_NOTICES.txt release/
          cd release
          sha256sum PyxeeRadio.Setup.*.exe PyxeeRadio-*-linux-x64.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Needs a public repo, or GitHub Enterprise Cloud for a private one. Never blocks the release.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/PyxeeRadio.Setup.*.exe
            release/PyxeeRadio-*-linux-x64.*
      - name: Write release notes
        env:
          # AI release notes, tried in this order; with none available the notes come from commit
          # messages and a static read of the code (see scripts/release_notes.py).
          #  1. ANTHROPIC_API_KEY (optional secret)
          #  2. AI_API_KEY secret + AI_BASE_URL and AI_MODEL variables (any OpenAI-compatible service,
          #     e.g. Gemini's free tier)
          #  3. GitHub Models, free, using the built-in token (needs `models: read` above)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes-header.md
            echo
            # What changed since the previous release: an AI summary if a key is set, otherwise grouped
            # commit messages plus what the code shows for vague messages like "Add files via upload".
            python3 scripts/release_notes.py --ai --tag "$TAG" --repo "$GITHUB_REPOSITORY" || {
              echo "::warning::Could not build the changelog; publishing without it." >&2
              echo "See the commit history for what changed."
            }
            echo
            echo "## About these builds"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "The Windows installer is code-signed."
            else
              echo "The Windows installer is **not code-signed**, so SmartScreen will warn about it."
            fi
            echo "The Linux builds are not signed; check them against \`SHA256SUMS.txt\`."
            if [ "${{ steps.attest.outcome }}" = "success" ]; then
              echo "Build provenance: verify with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            fi
          } > notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            "release/PyxeeRadio.Setup.${VERSION}.exe#PyxeeRadio Setup ${VERSION}.exe" \
            "release/PyxeeRadio-${VERSION}-linux-x64.tar.gz" \
            release/SHA256SUMS.txt \
            release/THIRD_PARTY_NOTICES.txt \
            --title "PyxeeRadio ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
